<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanPro – Premium Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-dark: #0f172a;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
      overflow-x: hidden;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
    }
    .login-container::before {
      content: '';
      position: absolute;
      top: -50px;
      left: -50px;
      width: 100px;
      height: 100px;
      background: var(--primary);
      filter: blur(80px);
      opacity: 0.4;
      z-index: -1;
    }
    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-box {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
    }
    .brand-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-tagline {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .card-header {
      margin-bottom: 32px;
    }
    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--text-muted);
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .input-group {
      position: relative;
    }
    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
    }
    input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px 12px 48px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .demo-divider {
      margin: 32px 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .demo-divider::before, .demo-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .demo-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .demo-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .demo-role {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .demo-user {
      font-size: 10px;
      color: var(--text-muted);
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <div class="logo-box">
        <i class="ti ti-building-bank"></i>
      </div>
      <h1 class="brand-name">LoanPro Enterprise</h1>
      <p class="brand-tagline">Advanced Financial Management Solutions</p>
    </div>

    <div class="glass-card">
      <div class="card-header">
        <h2 class="card-title">Welcome back</h2>
        <p class="card-desc">Enter your credentials to access your dashboard</p>
      </div>

      {% if error %}
      <div class="alert-error">
        <i class="ti ti-circle-x"></i>
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-group">
            <i class="ti ti-user-circle"></i>
            <input type="text" name="username" id="username" placeholder="e.g. admin" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <i class="ti ti-lock"></i>
            <input type="password" name="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>
        <button type="submit" class="btn-submit">
          Sign In <i class="ti ti-arrow-right"></i>
        </button>
      </form>

      <div class="demo-divider">Demo Accounts</div>
      
      <div class="demo-grid">
        <div class="demo-btn" onclick="fill('admin', 'admin123')">
          <div class="demo-role" style="color: #818cf8;">Admin</div>
          <div class="demo-user">admin</div>
        </div>
        <div class="demo-btn" onclick="fill('officer', 'officer123')">
          <div class="demo-role" style="color: #34d399;">Officer</div>
          <div class="demo-user">officer</div>
        </div>
        <div class="demo-btn" onclick="fill('borrower', 'borrower123')">
          <div class="demo-role" style="color: #fbbf24;">Borrower</div>
          <div class="demo-user">borrower</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function fill(u, p) {
      const uInput = document.getElementById('username');
      const pInput = document.getElementById('password');
      uInput.value = u;
      pInput.value = p;
      
      // Visual feedback
      uInput.style.borderColor = '#6366f1';
      pInput.style.borderColor = '#6366f1';
      setTimeout(() => {
        uInput.style.borderColor = '';
        pInput.style.borderColor = '';
      }, 1000);
    }
  </script>
</body>
</html>
