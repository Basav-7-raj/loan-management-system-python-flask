{% extends "base.html" %}{% block content %}<div class="container mt-4"><h2>Collections & Recovery Center</h2><table class="table table-striped"><tr><th>Loan ID</th><th>Borrower</th><th>Loan Amount</th><th>Recovered</th><th>Status</th></tr>{% for o in overdue %}<tr><td>{{o.loan_id}}</td><td>{{o.name}}</td><td>₹{{"{:,.0f}".format(o.amount)}}</td><td>₹{{"{:,.0f}".format(o.amount_paid)}}</td><td><span class="badge bg-danger">{{o.status}}</span></td></tr>{% endfor %}</table></div>{% endblock %}
